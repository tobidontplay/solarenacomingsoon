teaching_hooks:
  - id: H1
    type: mistake
    concept: Dead module versus dead route
    hook: The README still describes a landing file the router never mounts.
    source: src/pages/Landing.tsx
  - id: H2
    type: teaching
    concept: Invalid nested interactive elements
    hook: The router library already renders the anchor. Wrapping another anchor does not make a second link.
    source: src/components/Layout.tsx
  - id: H3
    type: teaching
    concept: A form component is not delivery
    hook: The modal can close on a JSON flag you have never seen returned.
    source: src/components/PartnerForm.tsx
  - id: H4
    type: decision
    concept: Brochure repo
    hook: The program and the brochure are different repositories on purpose.
    source: docs/architecture/decisions/001-keep-temp-landing.md
  - id: H5
    type: teaching
    concept: Done versus verified
    hook: Frontmatter can say Done while the verification table has no rows.
    source: docs/verification.md
  - id: H6
    type: bug
    concept: Tailwind content scan
    hook: A class name built with a template string is invisible to the stylesheet scanner.
    source: src/pages/Library.tsx
  - id: H7
    type: bug
    concept: Fonts are requests, not config
