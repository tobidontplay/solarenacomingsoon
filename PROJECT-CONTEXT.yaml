risks:
  - id: R1
    severity: HIGH
    confidence: high
    claim: Getting-started copy tells visitors to connect a wallet and stake. This origin cannot do that.
    evidence: src/pages/FAQ.tsx
  - id: R2
    severity: HIGH
    confidence: high
    claim: Audit and launch sentences on live pages contradict each other. No audit artifact is in the tree.
    evidence: src/pages/Home.tsx
  - id: R3
    severity: HIGH
    confidence: high
    claim: README, architecture overview, and FORM_SETUP.md describe a different tree than the router.
    evidence: README.md
  - id: R4
    severity: HIGH
    confidence: high
    claim: Partner delivery is unproven, and a Web3Forms access key is hardcoded in client source.
    evidence: src/components/PartnerForm.tsx
  - id: R5
    severity: HIGH
    confidence: high
    claim: Refresh safety depends on a host the repo does not name. Only Netlify has a rewrite.
    evidence: netlify.toml
  - id: R6
    severity: MED
    confidence: high
    claim: wouter Link renders an anchor. Call sites nest another anchor or a button. Clicks were not executed.
    evidence: src/components/Layout.tsx
  - id: R7
    severity: MED
    confidence: high
    claim: Named display fonts are never requested.
    evidence: index.html
  - id: R8
    severity: MED
    confidence: high
    claim: No lockfile and no CI. Installs float inside semver ranges.
    evidence: package.json
  - id: R9
    severity: LOW
    confidence: medium
    claim: Library icon classes are built with string interpolation. The two color utilities also appear as full strings elsewhere. Built CSS was not inspected.
    evidence: src/pages/Library.tsx

